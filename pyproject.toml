[project]
name = "ollie"
version = "0.1.0"
description = "A local-first dating simulator with a character that pushes back"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Coflazo" }, { name = "onysislabs" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "cryptography>=42",
    "pdfplumber>=0.11",
    "lxml>=5.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# Graph consolidation over episode cards. Optional by design: Ollie emits an equivalent
# graph.json itself when this is absent, and the demo never depends on it.
graph = ["graphifyy[pdf,ollama]>=0.9"]

[project.scripts]
ollie = "ollie.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ollie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
