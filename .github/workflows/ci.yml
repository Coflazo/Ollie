# Three things, and only things that can be checked without a model.
#
# The suite is deliberately model-free, so CI runs it in full rather than a subset. The
# C++ is built on both platforms because `tests/test_native_parity.py` is only meaningful
# when the library actually loaded — a green suite with the Python fallback silently in
# place is exactly the false confidence the parity test exists to prevent.
#
# The guard is the one that matters legally. The books are in-copyright commercial titles
# and nothing derived from them is redistributed; the repository has to enforce that
# rather than rely on everyone remembering.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: build the native library
        run: ./native/build.sh

      # Building it is not the same as loading it. ctypes will fall back to Python on an
      # architecture mismatch without raising, so assert the native path is actually live
      # before trusting the parity run that follows.
      - name: assert the native path loaded
        run: |
          native_status=$(python -c "import sys; sys.path.insert(0, 'native'); import loader; print(loader.status())")
          echo "native status: $native_status"
          if [ "$native_status" != "native" ]; then
            echo "::error::built the library but loaded the Python fallback ($native_status);"
            echo "::error::the parity test would have compared Python against itself"
            exit 1
          fi

      - name: pytest
        run: python -m pytest -q

  guard:
    name: no books, databases or weights
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Extension and path matching catches the honest mistake. The size cap catches the
      # renamed one: every legitimate file in this repository is under 100 KB, so anything
      # past a few megabytes is a book, a database or a set of weights wearing a new name.
      - name: check tracked files
        run: |
          forbidden=$(git ls-files \
            | grep -E '(^|/)(Books|corpus|data|exports|graphify_ws)/|\.(db|db-wal|db-shm|gguf|bin|safetensors|epub|pdf|mobi|azw3)$' \
            || true)
          if [ -n "$forbidden" ]; then
            echo "::error::books, databases, weights and conversation data are never committed"
            echo "$forbidden" | while read -r f; do echo "::error file=$f::$f must not be tracked"; done
            exit 1
          fi

          oversized=$(git ls-files -z | xargs -0 -r ls -l 2>/dev/null \
            | awk '$5 > 5242880 {print $5, $9}' || true)
          if [ -n "$oversized" ]; then
            echo "::error::a tracked file is over 5 MB, which no source file in this repo is"
            echo "$oversized"
            exit 1
          fi

          echo "clean: no books, databases or weights tracked"

  web:
    name: interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        working-directory: web
        run: npm ci

      # `npm run build` runs `tsc -b` first, so a type error fails here rather than
      # surfacing as a blank screen on the demo machine.
      - name: typecheck and build
        working-directory: web
        run: npm run build
