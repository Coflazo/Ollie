# Three things, and only things that can be checked without a model.
#
# The suite is deliberately model-free, so CI runs it in full rather than a subset. It runs
# on all three operating systems because most of what breaks in this project breaks on
# exactly one of them: a shared library named .so on a machine that only loads .dll, a temp
# directory that cannot be deleted because a SQLite handle is still open, a shell script
# whose shebang picked up a carriage return. None of those are visible from the other two.
#
# The C++ is built everywhere because `tests/test_native_parity.py` is only meaningful when
# the library actually loaded. A green suite with the Python fallback silently in place is
# exactly the false confidence the parity test exists to prevent.
#
# The guard is the one that matters legally. The books are in-copyright commercial titles
# and nothing derived from them is redistributed; the repository has to enforce that rather
# than rely on everyone remembering.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # build.py finds MSVC, Clang or GCC by itself, so this is the same command on all
      # three runners. The shell is pinned to bash so the two steps below can be written
      # once rather than once per platform.
      - name: build the native library
        shell: bash
        run: python native/build.py

      # Building it is not the same as loading it. ctypes falls back to Python on an
      # architecture mismatch or a missing dependency without raising, so assert the native
      # path is actually live before trusting the parity run that follows.
      - name: assert the native path loaded
        shell: bash
        run: |
          status=$(python -c "import sys; sys.path.insert(0, 'native'); import loader; print(loader.status())")
          echo "native status: $status"
          if [ "$status" != "native" ]; then
            echo "::error::built the library but loaded the Python fallback ($status);"
            echo "::error::the parity test would have compared Python against itself"
            exit 1
          fi

      - name: pytest
        shell: bash
        run: python -m pytest -q

  guard:
    name: no books, databases or weights
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Check both the current index and all objects reachable through Git history.
      - name: check tracked files and reachable history
        run: python scripts/check_private_corpus.py

  web:
    name: interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        working-directory: web
        run: npm ci

      # `npm run build` runs `tsc -b` first, so a type error fails here rather than
      # surfacing as a blank screen on the demo machine.
      - name: typecheck and build
        working-directory: web
        run: npm run build
